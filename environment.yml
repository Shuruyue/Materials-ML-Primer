# conda provides only Python; every package comes from pip. Mixing conda-forge's
# numpy/scipy with the PyTorch wheels loads two OpenMP runtimes (libomp and
# libiomp5md) on Windows, and importing torch then fails.
#
# After creating the environment, install this repository into it:
#   conda activate mmp
#   pip install -e .
name: mmp
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu132
      - torch
      - torch-geometric
      - gpytorch
      - numpy
      - scipy
      - matplotlib
      - pandas
      - scikit-learn
      - pymatgen
      - jarvis-tools
      - spglib
      - jupyterlab
      - ipykernel
      - nbconvert
      - pytest
      # pretrained_features: three universal interatomic potentials used as feature extractors
      # (mace-torch pins e3nn 0.4.4; none of the three changes the torch version)
      - mace-torch==0.3.17
      - chgnet==0.4.2
      - orb-models==0.7.0
