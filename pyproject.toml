[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "materials-ml-primer"
version = "0.1.0"
description = "Small, verified building blocks for machine learning on crystal structures"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Shuruyue" }]
dependencies = ["numpy>=1.26", "scipy", "jarvis-tools", "spglib>=2.5"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pymatgen"]
notebooks = ["matplotlib", "scikit-learn>=1.6", "pymatgen", "jupyterlab", "ipykernel", "nbconvert"]

[tool.setuptools]
packages = ["materials_ml_primer"]

[tool.setuptools.package-data]
materials_ml_primer = ["wyckoff_sets.json", "cgcnn_atom_init.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["needs_weights: loads a pretrained model, whose weights are downloaded on first use (tens of MB)"]

[tool.ruff]
line-length = 120
# the notebooks are generated by _build/build_*.py and executed; they are not linted
extend-exclude = ["experiments/**/*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I"]

[tool.ruff.lint.per-file-ignores]
# the notebook builders hold the notebooks' markdown as long prose strings
"_build/build_*.py" = ["E501"]
