[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "materials-ml-primer"
version = "0.1.0"
description = "Small, verified building blocks for machine learning on crystal structures"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Shuruyue" }]
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pymatgen"]
notebooks = ["matplotlib", "pymatgen", "jupyterlab", "ipykernel", "nbconvert"]

[tool.setuptools]
packages = ["materials_ml_primer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
